<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>הצעת מחיר | המעבדה להמרת קלטות ודיסקים</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- Customer quote page (spec crm/אפיון-הצעת-מחיר.md). Opened as p.html#<orders.quote_token> (staff preview: p.html?preview=1#<token>).
     Talks only to the edge function "quote". Look: the same design language as the questionnaire (q.html). Step 4 = working page; step 6 = full design. -->
<style>
  :root {
    color-scheme: light;
    --backdrop: #DDE2E8; --surface: #FFFFFF; --box-head: #E8EDF3; --ink: #1B1F27; --ink-muted: #59616E;
    --bar: #22324A; --on-bar: #FFFFFF; --link: #1A4FA0; --stamp: #FFB21E; --on-stamp: #1A1408; --stamp-text: #9A5B00;
    --rec: #C42A2A; --ok: #1F6F5C; --line: #C9D1DB; --row-alt: #F6F8FA; --sel: #FFF6E0;
    --sans: Arial, "Arial Hebrew", Tahoma, sans-serif;
    --radius-sm: 3px; --shadow-button: inset 0 -3px 0 rgba(0,0,0,0.22), 0 1px 2px rgba(20,26,36,0.18);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--backdrop); color: var(--ink); font: 16px/25px var(--sans); }
  a { color: var(--link); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .site { max-width: 720px; margin: 0 auto; background: var(--surface); min-height: 100vh; border-inline: 1px solid var(--line); padding-bottom: 104px; overflow-x: clip; }
  .header { background: var(--bar); color: var(--on-bar); display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .header svg { width: 56px; height: 56px; flex: none; }
  .header .t { font-weight: 700; font-size: 17px; line-height: 22px; }
  .header .s { font-size: 14px; opacity: .85; }
  .wrap { padding: 16px; display: grid; gap: 24px; }
  .intro h1 { font-size: 24px; line-height: 30px; margin: 0 0 6px; }
  .intro p { margin: 0; }
  .muted { color: var(--ink-muted); }
  .small { font-size: 14px; line-height: 20px; }
  .num { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
  .box { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
  .box-head { background: var(--box-head); border-bottom: 1px solid var(--line); padding: 8px 16px; font-weight: 700; margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .box-body { padding: 12px 16px; display: grid; gap: 12px; }
  .note { background: var(--row-alt); border-inline-start: 3px solid var(--ok); padding: 8px 12px; font-size: 14px; line-height: 20px; }
  .note.warn { border-color: var(--stamp); background: var(--sel); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .gallery a { display: block; border: 1px solid var(--line); padding: 3px; background: var(--surface); aspect-ratio: 1; }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* quote rows */
  .lrow { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .lrow:last-child { border-bottom: 0; }
  .lrow svg { width: 44px; height: 32px; }
  .lrow .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .lrow .sub { display: block; font-size: 13px; color: var(--ink-muted); line-height: 18px; font-weight: 400; }
  .lrow .sum { font-weight: 700; }
  .lrow.extra { grid-template-columns: 1fr auto; }
  .lrow.disc .nm, .lrow.disc .sum { color: var(--ok); }
  .totals { display: grid; gap: 4px; padding-top: 4px; }
  .totals .r { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
  .totals .grand { font-size: 22px; line-height: 30px; font-weight: 700; border-top: 2px solid var(--ink); padding-top: 8px; margin-top: 4px; align-items: baseline; }
  .totals s { color: var(--ink-muted); font-weight: 400; font-size: 16px; margin-inline-end: 8px; }
  .hold { font-weight: 700; color: var(--stamp-text); font-size: 15px; line-height: 22px; }
  .vat { font-size: 13px; color: var(--ink-muted); }
  /* upsell cards */
  .offers { display: grid; gap: 8px; }
  .offer { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; background: var(--surface); cursor: pointer; }
  .offer.on { border-color: #D9940F; background: var(--sel); box-shadow: inset 0 0 0 1px #D9940F; }
  .offer .tx { flex: 1; min-width: 0; }
  .offer b { display: block; }
  .offer .d { display: block; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
  .offer .price { font-weight: 700; color: var(--stamp-text); }
  .sw { position: relative; width: 52px; height: 30px; flex: none; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .sw span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: background .2s; }
  .sw span::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
  .sw input:checked + span { background: #D9940F; }
  .sw input:checked + span::after { transform: translateX(-22px); }
  .sw input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sw input:disabled { cursor: default; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pill { cursor: pointer; position: relative; }
  .pill input { position: absolute; opacity: 0; pointer-events: none; }
  .pill span { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-size: 14px; font-weight: 700; }
  .pill input:checked + span { border-color: #D9940F; background: var(--sel); box-shadow: inset 0 0 0 1px #D9940F; }
  /* fields */
  .field { display: grid; gap: 4px; }
  .field > span { font-weight: 700; font-size: 14px; }
  .field input { font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); width: 100%; min-height: 44px; }
  .field.bad input { border-color: var(--rec); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: #D9940F; flex: none; }
  .terms-text { white-space: pre-wrap; font-size: 13px; line-height: 19px; max-height: 180px; overflow: auto; border: 1px solid var(--line); padding: 10px; background: var(--row-alt); }
  .err { color: var(--rec); font-weight: 700; font-size: 14px; }
  .err:empty { display: none; }
  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px; border-radius: var(--radius-sm); font: 700 17px/22px var(--sans); text-decoration: none; cursor: pointer; box-shadow: var(--shadow-button); border: 1px solid transparent; }
  .btn:active { box-shadow: none; transform: translateY(2px); }
  .btn-primary { background: var(--stamp); color: var(--on-stamp); border-color: #D9940F; }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .link { background: none; border: 0; color: var(--link); text-decoration: underline; cursor: pointer; padding: 0; font-size: 14px; }
  .pay-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--bar); color: var(--on-bar); padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .pay-bar .in { max-width: 688px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
  .pay-bar .amt { font-size: 13px; line-height: 16px; opacity: .9; }
  .pay-bar .amt b { display: block; font-size: 22px; line-height: 26px; opacity: 1; }
  .pay-bar .btn { flex: 1; }
  .center { text-align: center; padding: 48px 16px; }
  .done { text-align: center; padding: 24px 16px; display: grid; gap: 14px; }
  .done .big { font-size: 44px; line-height: 1; color: var(--ok); }
  .done h1 { margin: 0; font-size: 24px; line-height: 30px; }
  .hidden { display: none !important; }
  .busy { opacity: .6; pointer-events: none; }
  #lightbox { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; overflow: hidden; }
  #lightbox[open] { display: flex; align-items: center; justify-content: center; }
  #lightbox::backdrop { background: rgba(10,12,16,.88); }
  #lbImg { max-width: calc(100vw - 32px); max-height: calc(100vh - 120px); border-radius: var(--radius-sm); background: #fff; }
  .lb-x { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.55); color: #fff; font: 700 30px/42px var(--sans); cursor: pointer; padding: 0; }
  .preview-tag { background: var(--rec); color: #fff; text-align: center; font-size: 13px; font-weight: 700; padding: 4px; }
  @media (max-width: 480px) { .wrap { padding: 12px; } .site { border: 0; } }
  @media print {
    body { background: #fff; }
    .site { border: 0; padding: 0; max-width: none; }
    .pay-bar, .no-print, .preview-tag { display: none !important; }
    .box { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="site">
  <div class="preview-tag hidden" id="previewTag">תצוגה מקדימה לצוות. לא נספרת כצפייה של הלקוח</div>
  <header class="header">
    <svg viewBox="0 0 240 240" aria-hidden="true"><rect width="240" height="240" rx="28" fill="#D9940F"/><rect width="240" height="228" rx="28" fill="#FFB21E"/><g transform="translate(36.8 62) scale(2.6)"><rect width="64" height="40" rx="3" fill="#1A1408"/><rect x="5" y="5" width="54" height="10" rx="1" fill="#EADFC2"/><circle cx="18" cy="26" r="7.5" fill="#FFB21E"/><circle cx="46" cy="26" r="7.5" fill="#FFB21E"/><circle cx="18" cy="26" r="3" fill="#1A1408"/><circle cx="46" cy="26" r="3" fill="#1A1408"/><rect x="27" y="23" width="10" height="6" rx="1" fill="#FFB21E"/><circle cx="57" cy="34" r="3" fill="#C42A2A"/></g></svg>
    <div><div class="t">המעבדה להמרת קלטות ודיסקים</div><div class="s" id="hdrSub">הצעת מחיר</div></div>
  </header>
  <main id="main"><div class="center muted">טוען את ההצעה…</div></main>
</div>
<div class="pay-bar hidden" id="bar"><div class="in"><div class="amt">לתשלום<b class="num" id="barAmt"></b></div><button class="btn btn-primary" id="payBtn">אישור ותשלום</button></div></div>
<dialog id="lightbox" aria-label="תמונה בגודל מלא"><button type="button" class="lb-x" id="lbX" aria-label="סגירה">×</button><img id="lbImg" alt=""></dialog>

<script src="config.js"></script>
<script>
'use strict';
const API = CRM_CONFIG.url + '/functions/v1/quote';
const TOKEN = location.hash.replace(/^#\/?/, '').trim();
const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ils = n => Number(n).toLocaleString('he-IL', { maximumFractionDigits: 2 }) + ' ₪';
let D = null;

// media icons, same as the questionnaire
const IC = {
  1: '<rect x="2" y="6" width="40" height="22" rx="2" fill="#1B1F27"/><rect x="6" y="9" width="32" height="6" fill="#EADFC2"/><circle cx="14" cy="21" r="4" fill="#FFB21E"/><circle cx="30" cy="21" r="4" fill="#FFB21E"/>',
  2: '<rect x="8" y="8" width="28" height="18" rx="2" fill="#1B1F27"/><rect x="11" y="10" width="22" height="5" fill="#EADFC2"/><circle cx="16" cy="20" r="3" fill="#FFB21E"/><circle cx="28" cy="20" r="3" fill="#FFB21E"/>',
  3: '<rect x="4" y="7" width="36" height="21" rx="2" fill="#59616E"/><rect x="8" y="10" width="28" height="9" rx="1" fill="#EADFC2"/><circle cx="15" cy="15" r="3" fill="#1B1F27"/><circle cx="29" cy="15" r="3" fill="#1B1F27"/><path d="M12 28l3-5h14l3 5z" fill="#1B1F27"/>',
  4: '<circle cx="22" cy="17" r="15" fill="#1B1F27"/><circle cx="22" cy="17" r="10" fill="none" stroke="#3A3F4A"/><circle cx="22" cy="17" r="5" fill="#C42A2A"/><circle cx="22" cy="17" r="1.2" fill="#fff"/>',
  5: '<circle cx="22" cy="17" r="14" fill="#E4532F"/><circle cx="22" cy="17" r="9" fill="#1F1F25"/><circle cx="22" cy="17" r="3" fill="#E4532F"/><circle cx="22" cy="7" r="2" fill="#fff"/><circle cx="22" cy="27" r="2" fill="#fff"/><circle cx="12" cy="17" r="2" fill="#fff"/><circle cx="32" cy="17" r="2" fill="#fff"/>',
  6: '<circle cx="22" cy="17" r="15" fill="#59616E"/><circle cx="22" cy="17" r="10" fill="#1F1F25"/><circle cx="22" cy="17" r="3.5" fill="#59616E"/>',
  7: '<circle cx="22" cy="17" r="15" fill="#C9D1DB"/><circle cx="22" cy="17" r="15" fill="none" stroke="#8C96A3"/><circle cx="22" cy="17" r="4" fill="#fff" stroke="#8C96A3"/>',
  8: '<rect x="6" y="4" width="32" height="26" fill="#fff" stroke="#8C96A3"/><rect x="9" y="7" width="26" height="17" fill="#8AB4F8"/><path d="M9 24l8-8 6 6 4-3 8 5z" fill="#1F6F5C"/>',
  9: '<rect x="10" y="3" width="24" height="28" rx="2" fill="#EADFC2" stroke="#8C96A3"/><rect x="14" y="8" width="16" height="13" fill="#59616E"/>',
  21: '<circle cx="11" cy="15" r="10" fill="#8C96A3"/><circle cx="11" cy="15" r="7" fill="#3A2A20"/><circle cx="33" cy="15" r="10" fill="#8C96A3"/><circle cx="33" cy="15" r="7" fill="#3A2A20"/><path d="M11 25 L33 25" stroke="#1B1F27" stroke-width="1.6"/>',
};
const icon = id => `<svg viewBox="0 0 44 34" aria-hidden="true">${IC[id] || IC[1]}</svg>`;

// ---------- server ----------
async function api(body) {
  const r = await fetch(API + (body ? '' : '?t=' + encodeURIComponent(TOKEN) + (PREVIEW ? '&preview=1' : '')), body
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: TOKEN, ...body }) } : undefined);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'error'); e.data = d; e.status = r.status; throw e; }
  return d;
}
async function start() {
  $('#previewTag').classList.toggle('hidden', !PREVIEW);
  if (!TOKEN) return fatal('הקישור לא שלם', 'בדקו שהעתקתם את כל הקישור מההודעה.');
  try { D = await api(); }
  catch (e) { return fatal(e.status === 404 ? 'הקישור לא נמצא' : 'משהו לא נטען', e.status === 404 ? 'בדקו את הקישור או כתבו לנו.' : 'נסו לרענן את הדף בעוד רגע.'); }
  if (D.paid) return renderPaid();
  render();
}
function fatal(t, p) { $('#bar').classList.add('hidden'); $('#main').innerHTML = `<div class="center"><h1 style="font-size:22px;margin:0 0 8px">${esc(t)}</h1><p class="muted">${esc(p)}</p>${waBtn()}</div>`; }
function waNum() { return String(D?.settings?.business_whatsapp || '').replace(/\D/g, ''); }
function waBtn(text = 'שלום, יש לי שאלה על הצעת המחיר') { const n = waNum(); return n ? `<a class="btn btn-secondary" href="https://wa.me/${n}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">כתבו לנו בוואטסאפ</a>` : ''; }

// "המחיר שמור לך עד יום חמישי 26.11 בשעה 23:59"
function holdText() {
  if (!D.valid_until || D.expired) return '';
  const d = new Date(D.valid_until), tz = { timeZone: 'Asia/Jerusalem' };
  const day = d.toLocaleDateString('he-IL', { ...tz, weekday: 'long' }), date = d.toLocaleDateString('he-IL', { ...tz, day: 'numeric', month: 'numeric' });
  const time = d.toLocaleTimeString('he-IL', { ...tz, hour: '2-digit', minute: '2-digit', hour12: false });
  return `המחיר הזה שמור לך עד ${day} ${date} בשעה ${time}`;
}

// ---------- page ----------
function quoteHtml() {
  const q = D.quote, hold = holdText(), hasDisc = q.discounts.length > 0;
  return `<section class="box"><h2 class="box-head">מה אנחנו ממירים בשבילך</h2><div class="box-body" style="gap:0">
      ${q.media.map(l => `<div class="lrow">${icon(l.product_id)}<div class="nm">${esc(l.name)}<span class="sub"><span class="num">${l.qty}</span> × <span class="num">${ils(l.unit_price)}</span></span></div><div class="sum num">${ils(l.sum)}</div></div>`).join('')}
    </div></section>
    ${q.extras.length ? `<section class="box"><h2 class="box-head">תוספות</h2><div class="box-body" style="gap:0">
      ${q.extras.map(l => `<div class="lrow extra"><div class="nm">${esc(l.name)}${l.qty > 1 ? `<span class="sub"><span class="num">${l.qty}</span> × <span class="num">${ils(l.unit_price)}</span></span>` : ''}</div><div class="sum num">${ils(l.sum)}</div></div>`).join('')}
    </div></section>` : ''}
    <section class="box" id="totalBox"><h2 class="box-head">סיכום</h2><div class="box-body">
      <div class="totals">
        ${hasDisc || q.min_order_fill > 0 ? `<div class="r"><span>סה"כ לפני הנחות</span><span class="num">${ils(q.subtotal)}</span></div>` : ''}
        ${q.discounts.map(x => `<div class="r lrow disc" style="border:0;padding:0;display:flex"><span class="nm">${esc(x.label)}</span><span class="sum num">−${ils(x.amount)}</span></div>`).join('')}
        ${q.min_order_fill > 0 ? `<div class="r"><span>השלמה למינימום הזמנה</span><span class="num">${ils(q.min_order_fill)}</span></div>` : ''}
        <div class="r grand"><span>לתשלום</span><span>${hasDisc && q.full_price > q.total ? `<s class="num">${ils(q.full_price)}</s>` : ''}<span class="num">${ils(q.total)}</span></span></div>
        <div class="vat">כל המחירים כוללים מע"מ</div>
      </div>
      ${hold ? `<div class="hold">${esc(hold)}${hasDisc ? '. אחרי זה ההנחות יורדות.' : ''}</div>` : ''}
      ${D.expired ? '<div class="note warn">תוקף ההנחות בהצעה הזו הסתיים, ולכן המחיר הוא המחיר המלא. אפשר עדיין לאשר ולשלם, או לכתוב לנו.</div>' : ''}
    </div></section>`;
}
function offersHtml() {
  if (!D.offers.length) return '';
  return `<section class="box no-print"><h2 class="box-head">רוצים להוסיף?</h2><div class="box-body"><div class="offers">${D.offers.map(o => {
    const usb = o.pid === 'usb', price = usb ? (o.sizes.find(s => s.size === (o.size || 32))?.price ?? o.price) : o.price;
    const name = usb ? 'דיסק און קי עם כל הקבצים' : o.name;
    return `<div class="offer ${o.on ? 'on' : ''}" data-offer="${esc(o.pid)}"><div class="tx"><b>${esc(name)}</b>${o.notes ? `<span class="d">${esc(o.notes)}</span>` : ''}
        ${usb ? `<div class="pills">${o.sizes.map(s => `<label class="pill"><input type="radio" name="usbSize" value="${s.size}" ${(o.size || 32) === s.size ? 'checked' : ''}><span>${s.size}GB · <span class="num">${ils(s.price)}</span></span></label>`).join('')}</div>` : `<span class="price num">+${ils(price)}</span>`}</div>
      <label class="sw"><input type="checkbox" data-addon="${esc(o.pid)}" ${o.on ? 'checked' : ''} aria-label="הוספת ${esc(name)}"><span></span></label></div>`;
  }).join('')}</div><div class="small muted">התוספות במחיר מלא. הסכום מתעדכן מיד.</div></div></section>`;
}
function invoiceHtml() {
  const c = D.customer;
  return `<section class="box"><h2 class="box-head">פרטים לחשבונית</h2><div class="box-body">
    <label class="check"><input type="checkbox" id="invBiz" ${c.invoice_business ? 'checked' : ''}><span>חשבונית על שם עסק</span></label>
    <div class="row2 ${c.invoice_business ? '' : 'hidden'}" id="invBizF">
      <label class="field"><span>שם העסק</span><input data-inv="business_name" value="${esc(c.business_name || '')}" autocomplete="organization"></label>
      <label class="field"><span>ח.פ / עוסק מורשה</span><input data-inv="business_id" value="${esc(c.business_id || '')}" inputmode="numeric"></label>
    </div>
    <div class="small muted" id="invPriv" ${c.invoice_business ? 'hidden' : ''}>החשבונית תצא על שם <b>${esc(c.full_name || '')}</b>${c.id_number ? ` (ת"ז <span class="num">${esc(c.id_number)}</span>)` : ''}.</div>
    <span class="small muted" id="invSave"></span>
  </div></section>`;
}
function acceptHtml() {
  const c = D.customer;
  return `<section class="box" id="acceptBox"><h2 class="box-head">אישור ההזמנה</h2><div class="box-body">
    ${D.settings.terms ? `<div class="terms-text">${esc(D.settings.terms)}</div>` : ''}
    <label class="check"><input type="checkbox" id="terms"><span>קראתי ואני מאשר/ת את תנאי השירות</span></label>
    <label class="field" id="nameF"><span>שם מלא</span><input id="accName" value="${esc(D.accepted_name || c.full_name || '')}" autocomplete="name" placeholder="שם פרטי ומשפחה"></label>
    <div class="err" id="accErr"></div>
    <div class="small muted">אחרי האישור עוברים לדף תשלום מאובטח (אשראי, עד 3 תשלומים). מיד אחרי התשלום נתאם איתך את איסוף החומרים.</div>
  </div></section>`;
}
function render() {
  const c = D.customer;
  $('#hdrSub').textContent = 'הצעת מחיר להזמנה ' + D.order_id;
  $('#main').innerHTML = `<div class="wrap">
    <div class="intro"><h1>${esc(c.first_name ? c.first_name + ', ההצעה שלך מוכנה' : 'ההצעה שלך מוכנה')}</h1>
      <p class="muted">עברנו על מה ששלחת. זה המחיר המלא, כולל כל מה שבחרת בשאלון.</p></div>
    ${D.photos.length ? `<div class="gallery">${D.photos.map(p => `<a href="${esc(p.url)}"><img src="${esc(p.url)}" alt="החומרה ששלחת" loading="lazy"></a>`).join('')}</div>` : ''}
    <div id="quoteBox" style="display:grid;gap:24px">${quoteHtml()}</div>
    <div id="offersBox">${offersHtml()}</div>
    ${invoiceHtml()}
    ${acceptHtml()}
    <div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="link" id="printBtn">שמירה כ-PDF / הדפסה</button>${waNum() ? `<span class="muted">·</span>${waBtn('שלום, אני רוצה לשנות משהו בהצעה').replace('btn btn-secondary', 'link')}` : ''}</div>
  </div>`;
  paintBar(); bind();
}
function paintBar() { $('#barAmt').textContent = ils(D.quote.total); $('#bar').classList.remove('hidden'); }
function repaintQuote() { $('#quoteBox').innerHTML = quoteHtml(); $('#offersBox').innerHTML = offersHtml(); bindOffers(); paintBar(); }

// ---------- behavior ----------
function bindOffers() {
  $$('[data-addon]').forEach(inp => inp.onchange = () => toggleAddon(inp.dataset.addon, inp.checked));
  // the whole card is the tap target, not only the small switch
  $$('[data-offer]').forEach(card => card.onclick = e => { if (e.target.closest('input, label')) return; const inp = $('[data-addon]', card); inp.checked = !inp.checked; inp.dispatchEvent(new Event('change')); });
  $$('input[name=usbSize]').forEach(r => r.onchange = () => { const on = $('[data-addon="usb"]'); if (on?.checked) toggleAddon('usb', true); else repaintUsbPrice(); });
}
function repaintUsbPrice() { /* price shows in the pill itself */ }
async function toggleAddon(pid, on) {
  const box = $('#offersBox'); box.classList.add('busy');
  try {
    const size = Number($('input[name=usbSize]:checked')?.value || 32);
    const r = await api({ op: 'addon', pid: pid === 'usb' ? 'usb' : Number(pid), on, size });
    Object.assign(D, { quote: r.quote, offers: r.offers });
    repaintQuote();
  } catch (e) { if (e.status === 409) return location.reload(); alert(e.message === 'כבר בהזמנה' ? 'זה כבר כלול בהזמנה' : 'לא הצלחנו לעדכן. נסו שוב.'); repaintQuote(); }
  finally { box.classList.remove('busy'); }
}
let invT = null;
function saveInvoice() {
  clearTimeout(invT); $('#invSave').textContent = '…';
  invT = setTimeout(async () => {
    const customer = { invoice_business: $('#invBiz').checked };
    $$('[data-inv]').forEach(i => customer[i.dataset.inv] = i.value);
    try { await api({ op: 'invoice', customer }); Object.assign(D.customer, customer); $('#invSave').textContent = 'נשמר ✓'; }
    catch { $('#invSave').textContent = 'לא נשמר. נסו שוב'; }
  }, 600);
}
function bind() {
  bindOffers();
  $('#invBiz').onchange = () => { const b = $('#invBiz').checked; $('#invBizF').classList.toggle('hidden', !b); $('#invPriv').hidden = b; saveInvoice(); };
  $$('[data-inv]').forEach(i => i.oninput = saveInvoice);
  $('#printBtn').onclick = () => window.print();
  $('#accName').oninput = () => $('#nameF').classList.remove('bad');
}
let clicked = false;
$('#payBtn').onclick = async () => {
  if (!clicked && !PREVIEW) { clicked = true; api({ op: 'pay_click' }).catch(() => {}); }
  const err = m => { $('#accErr').textContent = m; $('#acceptBox').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  const name = $('#accName').value.trim();
  if (!$('#terms').checked) return err('כדי להמשיך מסמנים שקראת את התנאים');
  if (name.split(/\s+/).filter(Boolean).length < 2) { $('#nameF').classList.add('bad'); return err('כותבים שם מלא: שם פרטי ומשפחה'); }
  if ($('#invBiz').checked && !($('[data-inv=business_name]').value.trim() && $('[data-inv=business_id]').value.trim())) return err('לחשבונית על שם עסק צריך שם עסק ומספר');
  if (PREVIEW) return err('בתצוגה המקדימה לא עוברים לתשלום');
  $('#accErr').textContent = '';
  const b = $('#payBtn'); b.disabled = true; b.textContent = 'פותח את דף התשלום…';
  try {
    clearTimeout(invT);
    const customer = { invoice_business: $('#invBiz').checked }; $$('[data-inv]').forEach(i => customer[i.dataset.inv] = i.value);
    await api({ op: 'invoice', customer });
    const r = await api({ op: 'accept', name, terms: true });
    location.href = r.url;
  } catch (e) {
    if (e.status === 409 && e.data?.track_url) return location.replace(e.data.track_url);
    err(e.message || 'משהו נכשל. נסו שוב');
    b.disabled = false; b.textContent = 'אישור ותשלום';
  }
};
function renderPaid() {
  $('#bar').classList.add('hidden');
  $('#hdrSub').textContent = 'הזמנה ' + D.order_id;
  $('#main').innerHTML = `<div class="done"><div class="big">✓</div><h1>ההזמנה שולמה. תודה${D.customer.first_name ? ', ' + esc(D.customer.first_name) : ''}!</h1>
    <p style="margin:0">נחזור אליך לתאם את איסוף החומרים. בדף המעקב רואים בכל רגע איפה ההזמנה.</p>
    ${D.track_url ? `<a class="btn btn-primary" href="${esc(D.track_url)}">לדף המעקב</a>` : ''}
    <div style="display:grid;gap:24px;text-align:start">${quoteHtml().replace(/<div class="hold">[\s\S]*?<\/div>/, '')}</div>
    ${D.accepted_name ? `<p class="small muted" style="margin:0">אושר על ידי ${esc(D.accepted_name)}</p>` : ''}
    <button class="link no-print" onclick="window.print()">שמירה כ-PDF / הדפסה</button></div>`;
}
// photo viewer
document.addEventListener('click', e => {
  const a = e.target.closest('.gallery a'); if (!a) return;
  e.preventDefault(); $('#lbImg').src = a.getAttribute('href'); $('#lightbox').showModal();
});
$('#lbX').onclick = () => $('#lightbox').close();
$('#lightbox').addEventListener('click', e => { if (e.target.id !== 'lbImg') $('#lightbox').close(); });
start();
</script>
</body>
</html>

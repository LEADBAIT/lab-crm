<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM המעבדה</title>
<meta name="theme-color" content="#1B1D24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css?v=1795369490">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="card login-card">
    <img class="logo" src="icon.svg" alt="">
    <div><h1>כניסה ל-CRM</h1><p class="muted">המעבדה להמרת קלטות ודיסקים</p></div>
    <label class="field">מייל<input type="email" name="email" required autocomplete="email"></label>
    <label class="field">סיסמה<input type="password" name="password" required minlength="6" autocomplete="current-password"></label>
    <button class="btn primary lg" type="submit">כניסה</button>
    <button class="btn ghost" type="button" id="signupBtn">פעם ראשונה כאן? הרשמה</button>
    <p class="small" id="loginMsg" role="status"></p>
  </form>
</div>

<div id="app" class="hidden">
  <aside class="rail">
    <a class="brand" href="#" aria-label="המעבדה: מסך הבית"><img src="icon.svg" alt=""></a>
    <nav id="nav" aria-label="ניווט ראשי"></nav>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="tb-start"><h1 class="page-title" id="pageTitle"></h1></div>
      <form id="searchForm" class="search" data-staff role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="חיפוש לקוח, טלפון, הזמנה או ברקוד" aria-label="חיפוש">
      </form>
      <div class="tb-end">
        <button class="btn primary quick-add" id="newLeadBtn" data-staff><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="new-txt">פנייה חדשה</span></button>
        <div class="usermenu dd">
          <button class="avatar" id="userBtn" aria-label="תפריט משתמש" aria-haspopup="menu"></button>
        </div>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>

<dialog id="modal"><div id="modalBody"></div></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script src="config.js?v=1795369490"></script>
<script src="help.js?v=1795369490"></script>
<script src="app.js?v=1795369490"></script>
<script src="steps.js?v=1795369490"></script>
<script src="queue.js?v=1795369490"></script>
<script src="sales.js?v=1795369490"></script>
<script src="deals.js?v=1795369490"></script>
<script src="photos.js?v=1795369490"></script>
<script src="deal.js?v=1795369490"></script>
<script src="ops.js?v=1795369490"></script>
<script src="shipments.js?v=1795369490"></script>
<script src="labs.js?v=1795369490"></script>
<script src="more.js?v=1795369490"></script>
<script>boot();</script>
</body>
</html>

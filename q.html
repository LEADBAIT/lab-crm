<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>שאלון לפני הצעת מחיר | המעבדה להמרת קלטות ודיסקים</title>
<meta property="og:title" content="שאלון קצר לפני הצעת המחיר">
<meta property="og:description" content="כמה שאלות (בערך 2 דקות), כדי שנכין לך הצעת מחיר מדויקת.">

<!-- Onboarding questionnaire (spec crm/אפיון-שאלון-אונבורדינג.md). Opened as q.html#<orders.q_token>.
     Talks only to the edge function "questionnaire"; every answer autosaves. Look: the landing page's design language. -->
<style>
  :root {
    color-scheme: light;
    --backdrop: #DDE2E8; --surface: #FFFFFF; --box-head: #E8EDF3; --ink: #1B1F27; --ink-muted: #59616E;
    --bar: #22324A; --on-bar: #FFFFFF; --link: #1A4FA0; --stamp: #FFB21E; --on-stamp: #1A1408; --stamp-text: #9A5B00;
    --rec: #C42A2A; --ok: #1F6F5C; --line: #C9D1DB; --row-alt: #F6F8FA; --sel: #FFF6E0;
    --sans: Arial, "Arial Hebrew", Tahoma, sans-serif;
    --radius-sm: 3px; --shadow-button: inset 0 -3px 0 rgba(0,0,0,0.22), 0 1px 2px rgba(20,26,36,0.18);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--backdrop); color: var(--ink); font: 16px/25px var(--sans); }
  a { color: var(--link); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .site { max-width: 720px; margin: 0 auto; background: var(--surface); min-height: 100vh; border-inline: 1px solid var(--line); padding-bottom: 96px; }
  .header { background: var(--bar); color: var(--on-bar); display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .header svg { width: 56px; height: 56px; flex: none; }
  .header .t { font-weight: 700; font-size: 17px; line-height: 22px; }
  .header .s { font-size: 14px; opacity: .85; }
  .progress { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .progress .track { flex: 1; height: 8px; background: var(--box-head); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .progress .fill { height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .progress .save { color: var(--ink-muted); min-width: 64px; text-align: left; }
  .wrap { padding: 16px; display: grid; gap: 20px; }
  .intro h1 { font-size: 24px; line-height: 30px; margin: 0 0 6px; }
  .intro p { margin: 0; }
  .muted { color: var(--ink-muted); }
  .small { font-size: 14px; line-height: 20px; }
  .box { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
  .box-head { background: var(--box-head); border-bottom: 1px solid var(--line); padding: 8px 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin: 0; font-size: 16px; }
  .box-head .n { width: 24px; height: 24px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--line); color: var(--stamp-text); text-align: center; line-height: 22px; font-size: 14px; flex: none; }
  .box-head .req { margin-inline-start: auto; font-size: 13px; font-weight: 400; color: var(--ink-muted); }
  .box.missing .box-head .req { color: var(--rec); font-weight: 700; }
  .box-body { padding: 16px; display: grid; gap: 14px; }
  .note { background: var(--row-alt); border-inline-start: 3px solid var(--ok); padding: 8px 12px; font-size: 14px; line-height: 20px; }
  .note.warn { border-color: var(--stamp); background: var(--sel); }
  /* photos */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .gallery a { display: block; border: 1px solid var(--line); padding: 3px; background: var(--surface); aspect-ratio: 1; }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* media rows */
  .mrow { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .mrow:last-child { border-bottom: 0; }
  .mrow.has .nm { font-weight: 700; }
  .mrow svg { width: 44px; height: 32px; }
  .mrow .sub { display: block; font-size: 13px; color: var(--ink-muted); line-height: 18px; }
  .qty { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
  .qty button { width: 40px; height: 40px; border: 0; background: var(--box-head); font-size: 20px; font-weight: 700; cursor: pointer; }
  .qty input { width: 52px; height: 40px; border: 0; border-inline: 1px solid var(--line); text-align: center; font-size: 17px; font-weight: 700; -moz-appearance: textfield; }
  .qty input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .more { background: none; border: 0; color: var(--link); text-decoration: underline; cursor: pointer; padding: 0; justify-self: start; }
  /* choices */
  .choices { display: grid; gap: 8px; }
  .choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; cursor: pointer; background: var(--surface); }
  .choice input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: #D9940F; }
  .choice:has(input:checked) { border-color: #D9940F; background: var(--sel); box-shadow: inset 0 0 0 1px #D9940F; }
  .choice > span:not(.price) { flex: 1; min-width: 0; }
  .choice b { display: block; }
  .site { overflow-x: clip; }
  .mrow .nm { min-width: 0; overflow-wrap: anywhere; }
  .choice .price { margin-inline-start: auto; font-weight: 700; white-space: nowrap; color: var(--stamp-text); direction: ltr; unicode-bidi: isolate; }
  .choice .d { display: block; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
  .sub-choice { margin-inline-start: 30px; display: grid; gap: 8px; }
  .row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .field { display: grid; gap: 4px; }
  .field > span { font-weight: 700; font-size: 15px; }
  .field > span i { font-style: normal; color: var(--rec); }
  .field input:not([type=radio]):not([type=checkbox]), .field select { font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); width: 100%; min-height: 44px; }
  .field.bad input { border-color: var(--rec); }
  .toggle-line { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .toggle-line input { width: 20px; height: 20px; accent-color: #D9940F; }
  details.terms summary { cursor: pointer; color: var(--link); text-decoration: underline; }
  details.terms div { white-space: pre-wrap; font-size: 14px; line-height: 20px; max-height: 240px; overflow: auto; border: 1px solid var(--line); padding: 10px; margin-top: 8px; background: var(--row-alt); }
  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px; border-radius: var(--radius-sm); font: 700 17px/22px var(--sans); text-decoration: none; cursor: pointer; box-shadow: var(--shadow-button); border: 1px solid transparent; }
  .btn:active { box-shadow: none; transform: translateY(2px); }
  .btn-primary { background: var(--stamp); color: var(--on-stamp); border-color: #D9940F; }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .submit-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--bar); padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .submit-bar .in { max-width: 688px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
  .submit-bar .btn { flex: 1; }
  .submit-bar .miss { color: #FFD27A; font-size: 13px; line-height: 18px; flex: 1.2; }
  .missing-list { color: var(--rec); font-weight: 700; margin: 0; padding-inline-start: 20px; }
  .done { text-align: center; padding: 24px 16px; display: grid; gap: 14px; }
  .done .big { font-size: 44px; line-height: 1; color: var(--ok); }
  .done h1 { margin: 0; font-size: 24px; line-height: 30px; }
  .summary { text-align: start; border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .summary dl { margin: 0; display: grid; grid-template-columns: auto 1fr; }
  .summary dt, .summary dd { margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .summary dt { font-weight: 700; background: var(--box-head); }
  .center { text-align: center; padding: 48px 16px; }
  .hidden { display: none !important; }
  dialog { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0; max-width: min(420px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(20,26,36,.5); }
  dialog .box-body p { margin: 0; }
  dialog .acts { display: flex; gap: 8px; }
  dialog .acts .btn { flex: 1; }
  .upl { display: grid; gap: 10px; }
  /* compact: short answers as pills, several fields per row */
  .promo-banner { display: grid; gap: 2px; background: var(--stamp); color: var(--on-stamp, #1A1408); border-radius: var(--radius-sm); padding: 12px 14px; box-shadow: inset 0 -3px 0 #D9940F; }
  .promo-banner b { font-size: 17px; }
  .promo-banner span { font-size: 14px; }
  .pkgs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .pkg { position: relative; display: flex; flex-direction: column; gap: 4px; text-align: start; font: inherit; color: inherit; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); padding: 14px 12px 12px; cursor: pointer; }
  .pkg.on { border-color: #D9940F; background: var(--sel); box-shadow: inset 0 0 0 1px #D9940F; }
  .pkg-img { width: 100%; height: 90px; object-fit: cover; border-radius: var(--radius-sm); }
  .pkg-name { font-size: 16px; }
  .pkg-price { font-weight: 700; color: var(--stamp-text); }
  .pkg-save { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--ok); }
  .pkg-d { font-size: 14px; color: var(--ink-muted); }
  .pkg-list { margin: 4px 0 0; padding-inline-start: 18px; font-size: 14px; line-height: 20px; }
  .pkg-cta { margin-top: auto; padding-top: 8px; font-weight: 700; font-size: 14px; color: var(--stamp-text); }
  .pkg-rec { position: absolute; top: -10px; inset-inline-start: 10px; background: var(--stamp); color: var(--on-stamp, #1A1408); border-radius: 99px; padding: 0 10px; font-size: 12px; font-weight: 700; line-height: 20px; }
  .pkg-rec.inline { position: static; display: inline-block; margin-inline-start: 6px; vertical-align: 1px; }
  .offer-q .x-img { width: 44px; height: 44px; object-fit: cover; border-radius: var(--radius-sm); flex: none; }
  .qty.sm { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; }
  .qty.sm button { width: 30px; height: 30px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { cursor: pointer; position: relative; }
  .pill input { position: absolute; opacity: 0; pointer-events: none; }
  .pill span { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-size: 15px; font-weight: 700; }
  .pill em { font-style: normal; color: var(--stamp-text); direction: ltr; unicode-bidi: isolate; }
  .pill input:checked + span { border-color: #D9940F; background: var(--sel); box-shadow: inset 0 0 0 1px #D9940F; }
  .pill input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
  .q2 { display: grid; gap: 6px; }
  .q2 > span { font-weight: 700; font-size: 15px; }
  .row4 { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1.2fr; gap: 8px; }
  .row2 { grid-template-columns: 1fr 1fr; gap: 8px; }
  .row2.tight { margin-top: -6px; }
  .field > span { font-size: 14px; }
  .sel { font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); width: 100%; min-height: 44px; }
  .terms-text { white-space: pre-wrap; font-size: 13px; line-height: 19px; max-height: 200px; overflow: auto; border: 1px solid var(--line); padding: 10px; background: var(--row-alt); }
  .wrap { gap: 32px; } /* clear space between the numbered questions (1 | 2 | 3 …) */
  .wrap > .intro, .wrap > .gallery { margin-bottom: -12px; } /* intro and sent photos stay close to the first question */
  .box-body { padding: 12px; gap: 12px; }
  .choice { padding: 10px 12px; }
  .mrow { padding: 6px 0; }
  /* the photos the customer sent on WhatsApp (top of the form): big enough to see clearly */
  .gallery { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
  /* the customer's own uploads: thumbnail + remove button */
  .ph { position: relative; display: block; }
  .ph-del { position: absolute; top: -7px; inset-inline-start: -7px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); background: var(--rec); color: #fff; font: 700 16px/18px var(--sans); cursor: pointer; padding: 0; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  /* mould: answers on the right, the example picture on the left of them */
  /* the hardware box: three clearly separated sub-questions */
  [data-box="qty"] .box-body { gap: 0; padding-top: 4px; }
  .qsec { display: grid; gap: 10px; padding: 14px 0; }
  .qsec + .qsec { border-top: 1px solid var(--line); }
  .qsec:last-child { padding-bottom: 4px; }
  .qsec-h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; line-height: 22px; }
  .mlist .mrow:first-child { padding-top: 0; }
  .subpanel { background: var(--row-alt); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; display: grid; gap: 10px; }
  .subpanel .upl { gap: 8px; }
  .subpanel .gallery { grid-template-columns: repeat(auto-fill, 56px); }
  .subpanel .gallery a { width: 56px; height: 56px; }
  .subpanel .gallery { padding-top: 6px; }
  #photoNeed:empty { display: none; }
  .upl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .upl-row .gallery { display: flex; flex-wrap: wrap; gap: 6px; }
  .upl-row .gallery.hidden { display: none !important; }
  .upl-btn { min-height: 40px; font-size: 14px; padding: 8px 14px; }
  #updMsg:empty { display: none; }
  /* photo viewer */
  #lightbox { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; overflow: hidden; }
  #lightbox[open] { display: flex; align-items: center; justify-content: center; }
  #lightbox::backdrop { background: rgba(10,12,16,.88); }
  #lbImg { max-width: calc(100vw - 32px); max-height: calc(100vh - 120px); border-radius: var(--radius-sm); box-shadow: 0 8px 30px rgba(0,0,0,.5); background: #fff; }
  .lb-x { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.55); color: #fff; font: 700 30px/42px var(--sans); cursor: pointer; padding: 0; }
  .rec-tag { background: var(--ok); color: #fff; font-size: 11px; line-height: 16px; padding: 1px 7px; border-radius: 99px; }
  #usbRec { color: var(--ok); font-weight: 700; }
  .mold-row { display: flex; align-items: center; gap: 10px; }
  .mold-row .pills { flex: none; }
  .mold-row .pills { flex-wrap: nowrap; gap: 5px; }
  .mold-row .pill span { padding: 6px 10px; font-size: 14px; white-space: nowrap; }
  .mold-pic { width: 88px; height: 88px; flex: none; border: 1px solid var(--line); padding: 2px; background: var(--surface); display: block; cursor: zoom-in; }
  .mold-pic { position: relative; overflow: hidden; text-decoration: none; }
  .mold-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mold-cap { position: absolute; inset-inline: 2px; bottom: 2px; background: rgba(20,22,28,.78); color: #fff; font-size: 10px; line-height: 12px; font-weight: 700; text-align: center; padding: 3px 2px; }
  .note.good { border-inline-start-width: 4px; background: #E9F5F0; color: #14503F; font-size: 15px; line-height: 22px; }
  .more { font-weight: 700; }
  .upl .need { font-weight: 700; color: var(--stamp-text); font-size: 14px; line-height: 20px; }
  @media (max-width: 480px) { .wrap { padding: 12px; } .site { border: 0; } }
</style>
</head>

<noscript><p style="padding:24px;font-family:sans-serif">כדי למלא את השאלון צריך לאפשר JavaScript בדפדפן, או לכתוב לנו בוואטסאפ.</p></noscript>

    <div><div class="t">המעבדה להמרת קלטות ודיסקים</div><div class="s">שאלון קצר לפני הצעת המחיר</div></div>

<script>
'use strict';
const API = CRM_CONFIG.url + '/functions/v1/questionnaire';
const TOKEN = location.hash.replace(/^#\/?/, '').trim();
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ils = n => Number(n).toLocaleString('he-IL', { maximumFractionDigits: 0 }) + ' ₪';
let D = null;                 // server state
const confirmedType = new Set(); // media types whose quantity change the customer already confirmed

// ---------- icons per media product (help the customer recognise what they have) ----------
const IC = {
  1: '<rect x="2" y="6" width="40" height="22" rx="2" fill="#1B1F27"/><rect x="6" y="9" width="32" height="6" fill="#EADFC2"/><circle cx="14" cy="21" r="4" fill="#FFB21E"/><circle cx="30" cy="21" r="4" fill="#FFB21E"/>',

  3: '<rect x="4" y="7" width="36" height="21" rx="2" fill="#59616E"/><rect x="8" y="10" width="28" height="9" rx="1" fill="#EADFC2"/><circle cx="15" cy="15" r="3" fill="#1B1F27"/><circle cx="29" cy="15" r="3" fill="#1B1F27"/><path d="M12 28l3-5h14l3 5z" fill="#1B1F27"/>',
  4: '<circle cx="22" cy="17" r="15" fill="#1B1F27"/><circle cx="22" cy="17" r="10" fill="none" stroke="#3A3F4A"/><circle cx="22" cy="17" r="5" fill="#C42A2A"/><circle cx="22" cy="17" r="1.2" fill="#fff"/>',
  5: '<circle cx="22" cy="17" r="14" fill="#E4532F"/><circle cx="22" cy="17" r="9" fill="#1F1F25"/><circle cx="22" cy="17" r="3" fill="#E4532F"/><circle cx="22" cy="7" r="2" fill="#fff"/><circle cx="22" cy="27" r="2" fill="#fff"/><circle cx="12" cy="17" r="2" fill="#fff"/><circle cx="32" cy="17" r="2" fill="#fff"/>',

}

function queue(part, key, val, now = false) {

}
function flush() {
  const p = pend; pend = { customer: {}, order: {}, lines: {}, extras: {} };
  if (!Object.keys(p.customer).length && !Object.keys(p.order).length && !Object.keys(p.lines).length && !Object.keys(p.extras).length) return inflight;
  const body = { op: 'save' };
  if (Object.keys(p.customer).length) body.customer = p.customer;
  if (Object.keys(p.order).length) body.order = p.order;
  if (Object.keys(p.lines).length) body.lines = p.lines;

}

function offerRow(f) {
  const q = qtyOf(f.id), inc = inPkg(f.id);
  return `<label class="choice offer-q" data-x="${f.id}">${f.image ? `<img src="${esc(f.image)}" alt="" class="x-img">` : ''}
    <input type="checkbox" ${q ? 'checked' : ''} aria-label="${esc(f.name)}"><span><b>${esc(f.name)}${f.recommended ? ' <span class="pkg-rec inline">מומלץ</span>' : ''}</b>${f.description ? `<span class="d">${esc(f.description)}</span>` : ''}
    ${inc ? '<span class="d" style="color:var(--ok)">כלול בחבילה שבחרת</span>' : ''}
    ${f.pricing === 'unit' && q ? `<span class="qty sm" data-xq><button type="button" data-xd="-1" aria-label="פחות">−</button><b class="num">${q}</b><button type="button" data-xd="1" aria-label="עוד">+</button></span>` : ''}</span>
    <span class="price">${inc && q <= inc ? 'כלול' : '+' + ils(f.price) + (f.pricing === 'unit' ? ' ליחידה' : '')}</span></label>`;
}
function paintExtras() {
  const box = $('[data-box="extras"] .choices'); if (!box) return;
  box.innerHTML = D.offers.map(offerRow).join('');
  $$('[data-x]', box).forEach(row => {
    const id = Number(row.dataset.x), f = D.offers.find(x => x.id === id);
    const set = v => { v = Math.max(0, Math.min(f.pricing === 'unit' ? 20 : 1, v)); const l = D.lines.find(x => x.product_id === id);
      if (l) l.qty = v; else D.lines.push({ product_id: id, qty: v }); queue('extras', id, v, true); paintExtras(); };
    $('input', row).onchange = e => set(e.target.checked ? 1 : 0);
    $$('[data-xd]', row).forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); set(qtyOf(id) + Number(b.dataset.xd)); });
  });
}
function mrow(p) {
  const q = qtyOf(p.id);
  // "קלטת וידאו (VHS / VHS-C)" → Hebrew name, and the formats on their own line (left-to-right, so the slashes stay in order)
  const [nm, fmt] = [p.name.split(' (')[0], (p.name.match(/\(([^)]+)\)/) || [])[1]];
  return `<div class="mrow ${q ? 'has' : ''}" data-m="${p.id}">${icon(p.id)}<div class="nm">${esc(nm)}${fmt ? `<span class="sub"><bdi dir="ltr">${esc(fmt)}</bdi></span>` : ''}${p.notes ? `<span class="sub">${esc(p.notes)}</span>` : ''}</div>
    <div class="qty"><button type="button" data-qd="-1" aria-label="פחות">−</button><input type="number" min="0" inputmode="numeric" value="${q || ''}" placeholder="0" aria-label="כמות ${esc(p.name)}"><button type="button" data-qd="1" aria-label="עוד">+</button></div></div>`;
}

// ---------- behaviour ----------
function bind() {
  // text fields
  $$('input[data-part]:not([type=checkbox]), select[data-part]').forEach(el => el.addEventListener('input', () => { if (el.dataset.part === 'customer') C()[el.dataset.k] = el.value; else O()[el.dataset.k] = el.value; queue(el.dataset.part, el.dataset.k, el.value); }));
  $$('select[data-part]').forEach(el => el.addEventListener('change', () => queue(el.dataset.part, el.dataset.k, el.value, true)));
  // checkboxes
  $$('input[type=checkbox][data-part]').forEach(el => el.addEventListener('change', () => {
    const v = el.checked; if (el.dataset.part === 'customer') C()[el.dataset.k] = v; else O()[el.dataset.k] = v;
    if (el.dataset.k === 'invoice_business') { $('#invPrivate').classList.toggle('hidden', v); $('#invBiz').classList.toggle('hidden', !v); }
    if (el.dataset.k === 'q_unsure_type') paintPhotoNeed();
    queue(el.dataset.part, el.dataset.k, v, true);
  }));
  // radios
  $$('input[type=radio]').forEach(el => el.addEventListener('change', () => {
    const k = el.name, v = el.value;
    if (k === 'usb_size') { O().usb_size = Number(v); setUsbLine(Number(v)); return queue('order', 'usb_size', Number(v), true); }
    O()[k] = v;
    if (k === 'return_method') $('#pickupNote').classList.toggle('hidden', v !== 'איסוף עצמי');
    if (k === 'delivery_method') {
      $$('[data-sub]').forEach(s => s.classList.toggle('hidden', s.dataset.sub !== v));
      if (v !== 'דיסק און קי') { O().usb_size = null; setUsbLine(0); $$('input[name=usb_size]').forEach(r => r.checked = false); }
      else if (!O().usb_size) { const rec = usbRecFor(estGb()); $(`input[name=usb_size][value="${rec}"]`).checked = true; O().usb_size = rec; setUsbLine(rec); queue('order', 'usb_size', rec); }
      if (v !== 'ענן אישי של הלקוח') { O().cloud_type = null; }
      paintPackages();
    }
    queue('order', k, v, true);
  }));
  // quantities
  $$('[data-m]').forEach(row => {
    const id = Number(row.dataset.m), input = $('input', row);
    const set = async v => {
      v = Math.max(0, Math.min(5000, Math.floor(Number(v) || 0)));
      const cur = qtyOf(id);
      if (v === cur) { input.value = v || ''; return; }
      // any change except removing a type asks once per type ("בטוח?"); the change is flagged in the CRM
      if (v > 0 && !confirmedType.has(id) && (initQty(id) > 0 || D.order.initial_lines?.length)) {
        const ok = await ask('לשנות את הכמות?', `רשמנו את הכמות של ${prod(id).name.split(' (')[0]} לפי התמונות ששלחת. בטוח שאתה רוצה לשנות אותה?`, 'כן, לשנות', 'לא, להשאיר');
        if (!ok) { input.value = cur || ''; return; }
        confirmedType.add(id);
      }
      input.value = v || '';
      const l = D.lines.find(x => x.product_id === id); if (l) l.qty = v; else D.lines.push({ product_id: id, qty: v });
      row.classList.toggle('has', v > 0); queue('lines', id, v); paintDisk(); paintPackages();
    };
    $$('[data-qd]', row).forEach(b => b.onclick = () => set(qtyOf(id) + Number(b.dataset.qd)));
    input.addEventListener('change', () => set(input.value));
  });
  $('#termsBtn') && ($('#termsBtn').onclick = e => { e.preventDefault(); $('#termsText').classList.toggle('hidden'); });
  // "+ יש לי עוד סוגי חומרה" opens the other types and, with them, the "not sure" + photos panel
  $('#moreTypes') && ($('#moreTypes').onclick = () => { $('#restTypes').classList.remove('hidden'); $('#unsurePanel').classList.remove('hidden'); $('#moreTypes').classList.add('hidden'); });
  $('#submitBtn').onclick = submit;
  paintExtras();
}
const USB_PID = { 16: 22, 32: 11, 128: 12 }; // USB size GB → product id
/** smallest USB stick that fits the estimate (with 25% spare) */
const usbRecFor = gb => gb * 1.25 <= 16 ? 16 : gb * 1.25 <= 32 ? 32 : 128;
function setUsbLine(size) {
  const ids = Object.values(USB_PID);
  D.lines = D.lines.filter(l => !ids.includes(l.product_id));
  if (USB_PID[size]) D.lines.push({ product_id: USB_PID[size], qty: 1 });
}
function qtyChangedLocal() {
  const ids = new Set([...(D.order.initial_lines || []).map(l => l.product_id), ...D.lines.map(l => l.product_id)]);
  return [...ids].filter(id => prod(id)?.category === 'media').some(id => initQty(id) !== qtyOf(id));
}
/** photos of the hardware: optional, but required when the customer is not sure what they have */
function paintPhotoNeed() {
  const box = $('#photoNeed'); if (!box) return;
  const must = !!O().q_unsure_type;
  if (box.dataset.ready !== String(must)) {
    box.dataset.ready = String(must);
    box.innerHTML = `<div class="upl ${must ? 'note warn' : ''}">
      ${must ? '<span class="need">העלה תמונות של כל החומרה, ואנחנו נבדוק בעצמנו (חשוב שהתמונות יהיו ברורות)</span>' : ''}
      <div class="upl-row"><div class="gallery" id="updGallery"></div>
      <label class="btn ${must ? 'btn-primary' : 'btn-secondary'} upl-btn">${must ? 'העלאת תמונות' : '+ הוספת תמונה (לא חובה)'}<input type="file" accept="image/*" multiple hidden id="updPhoto"></label></div><span class="small" id="updMsg"></span></div>`;
    $('#updPhoto').onchange = e => uploadUpdate([...e.target.files]);
  }
  paintUploads();
}
function paintUploads() {
  const g = $('#updGallery'); if (!g) return;
  const ups = D.photos.filter(p => p.source === 'customer' && p.url);
  g.innerHTML = ups.map(p => `<span class="ph"><a href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.url)}" alt="תמונה של החומרה"></a><button type="button" class="ph-del" data-phdel="${p.id}" aria-label="הסרת התמונה">×</button></span>`).join('');
  g.classList.toggle('hidden', !ups.length);
  $$('[data-phdel]', g).forEach(b => b.onclick = async () => {
    if (!await ask('להסיר את התמונה?', 'התמונה תוסר מהשאלון.', 'כן, להסיר', 'לא')) return;
    b.disabled = true;
    try { const r = await api({ op: 'photo_delete', id: Number(b.dataset.phdel) }); D.photos = D.photos.filter(p => p.id !== Number(b.dataset.phdel)); D.progress = r.progress; D.missing = r.missing; paintUploads(); paintProgress(); }
    catch { b.disabled = false; const m = $('#updMsg'); if (m) m.textContent = 'ההסרה נכשלה. נסה שוב.'; }
  });
}
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file); const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85)); return b ? { blob: b, type: 'image/jpeg' } : { blob: file, type: file.type };
  } catch { return { blob: file, type: file.type || 'image/jpeg' }; }
}
async function uploadUpdate(files) {
  const msg = $('#updMsg');
  for (let i = 0; i < files.length; i++) {
    msg.textContent = `מעלה ${i + 1} מתוך ${files.length}…`;
    const { blob, type } = await shrink(files[i]);
    const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
    try { const r = await api({ op: 'photo', name: files[i].name, type, data }); D.photos.push(r.photo); D.progress = r.progress; D.missing = r.missing; }
    catch { msg.textContent = 'ההעלאה נכשלה. נסה שוב.'; return; }
  }
  paintUploads(); paintProgress(); msg.textContent = 'התמונה נשמרה ✓';
}
function paintDisk() {
  const gb = estGb(), s = diskFor(gb);
  const t = gb > 0 ? `לפי הכמויות, מומלץ דיסק של ${diskLabel(s)} לפחות.` : '';
  $('#diskRec') && ($('#diskRec').textContent = t);
  // the recommended USB size gets a "מומלץ" tag (none until there are quantities)
  const rec = gb > 0 ? String(usbRecFor(gb)) : '';
  $$('input[name=usb_size]').forEach(r => { const sp = r.nextElementSibling; sp.querySelector('.rec-tag')?.remove(); if (r.value === rec) sp.insertAdjacentHTML('afterbegin', '<b class="rec-tag">מומלץ</b>'); });
  $('#usbRec') && ($('#usbRec').textContent = gb > 0 ? (s > 128 ? 'לכמות כזו ייתכן שנצטרך יותר מדיסק אחד. נחזור אליך עם המלצה.' : `לפי כמות החומרה שסימנת, ${rec}GB יספיק עבור כל החומרה.`) : '');
}
function paintProgress() {
  $('#pct').textContent = D.progress + '%'; $('#fill').style.width = D.progress + '%';
  const miss = D.missing || [];
  $$('[data-box]').forEach(b => b.classList.remove('missing'));
  $('#barMiss').textContent = !miss.length ? 'הכל מוכן לשליחה ✓' : miss.length === 1 ? `נשאר רק: ${miss[0].label}` : `נשארו ${miss.length} שאלות חובה`;
}
const MISS_BOX = { qty: 'qty', photo: 'qty', address: 'address', alt: 'address', delivery: 'delivery', return: 'return', invoice: 'invoice', email: 'invoice', terms: 'invoice' };
async function submit() {
  const b = $('#submitBtn'); b.disabled = true; b.textContent = 'שולח…';
  try { await flush(); await inflight; await api({ op: 'submit' }); sessionStorage.removeItem('q-edit'); D.order.q_submitted_at = new Date().toISOString(); renderDone(); window.scrollTo(0, 0); }
  catch (e) {
    const miss = e.data?.missing || D.missing || [];
    $$('[data-box]').forEach(x => x.classList.remove('missing'));
    miss.forEach(m => $(`[data-box="${MISS_BOX[m.key]}"]`)?.classList.add('missing'));
    $('#missBox').innerHTML = miss.length ? `<div class="note warn"><b>כדי לשלוח, חסר עוד:</b><ul class="missing-list">${miss.map(m => `<li>${esc(m.label)}</li>`).join('')}</ul></div>` : '<div class="note warn">השליחה נכשלה. נסה שוב בעוד רגע.</div>';
    const first = miss[0] && $(`[data-box="${MISS_BOX[miss[0].key]}"]`); (first || $('#missBox')).scrollIntoView({ behavior: 'smooth', block: 'start' });
  } finally { b.disabled = false; b.textContent = 'שליחה'; }
}

// ---------- after sending ----------
function summaryHtml() {
  const c = C(), o = O();
  const items = media().filter(p => qtyOf(p.id) > 0).map(p => `${qtyOf(p.id)} × ${p.name.split(' (')[0]}`).join('<br>') || '—';
  const del = o.delivery_method === 'דיסק און קי' ? `דיסק און קי ${o.usb_size || ''}GB מאיתנו` : o.delivery_method === 'ענן אישי של הלקוח' ? `העלאה ל-${o.cloud_type || 'ענן'}` : o.delivery_method === 'דיסק של הלקוח' ? 'דיסק שלי, נשלח עם החומרה' : '—';
  const addr = [c.street, c.house_number].filter(Boolean).join(' ') + (c.city ? ', ' + c.city : '');
  const row = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
  return `<div class="summary"><dl>${row('החומרה', items)}${row('קבצים', esc(del))}${row('אקספרס', o.priority ? 'כן' : 'לא')}${row('החומרה בסוף', esc(o.return_method || '—'))}${row('איסוף מ-', esc(addr) + (D.settings.pickup_included_text ? ' · שליח חינם, כלול' : ''))}${row('חשבונית', esc(c.invoice_business ? c.business_name : c.email))}</dl></div>`;
}
function renderDone() {
  $('#progress').classList.add('hidden'); $('#bar').classList.add('hidden');
  const fn = firstName(C().full_name);
  $('#main').innerHTML = `<div class="done"><div class="big">✓</div><h1>תודה${fn ? ' ' + esc(fn) : ''}, קיבלנו הכל</h1>
    <p style="margin:0">נבדוק את הפרטים, והצעת המחיר תישלח אליך בוואטסאפ <b>בשעות הקרובות</b>.</p>
    ${summaryHtml()}
    <p class="small muted" style="margin:0">משהו לא נכון? אפשר לעדכן עד שנשלח את ההצעה.</p>
    <div style="display:grid;gap:8px"><button class="btn btn-secondary" id="editAgain">עדכון התשובות</button>${waBtn('שלום, מילאתי את השאלון')}</div></div>`;
  $('#editAgain').onclick = () => { sessionStorage.setItem('q-edit', '1'); render(); window.scrollTo(0, 0); };
}
function renderLocked() {
  $('#main').innerHTML = `<div class="done"><h1>ההצעה כבר נשלחה אליך</h1><p style="margin:0">לשינויים בפרטים, דבר איתנו ונעדכן.</p>${summaryHtml()}${waBtn('שלום, אני רוצה לשנות משהו בהזמנה')}</div>`;
}
// ---------- photo viewer: photos open inside the form (not a new tab); close with ×, a tap around the photo, or Esc ----------
document.addEventListener('click', e => {
  const a = e.target.closest('a.mold-pic, .gallery a'); if (!a) return;
  e.preventDefault();
  const img = a.querySelector('img'), lb = $('#lightbox');
  $('#lbImg').src = a.getAttribute('href'); $('#lbImg').alt = img?.alt || '';
  lb.showModal();
});
$('#lbX').onclick = () => $('#lightbox').close();
$('#lightbox').addEventListener('click', e => { if (e.target.id !== 'lbImg') $('#lightbox').close(); });
start();
</script>
